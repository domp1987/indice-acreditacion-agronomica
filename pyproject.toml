[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indice-acreditacion"
version = "0.2.0"
description = "Índice de evidencias de acreditación CNA → ABET, Ingeniería Agronómica (UCundinamarca)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Respaldo si no hay poppler (pdftotext); el texto sale distinto y cambia la base
pypdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
indice = "indice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
indice = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
