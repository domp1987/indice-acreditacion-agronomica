# Configuración del índice. Las rutas relativas se resuelven desde esta carpeta.
# Las opciones --pdf y --salida de la CLI tienen prioridad sobre estos valores.
[rutas]
# Carpeta de presentaciones: PDF y PPTX, incluidas subcarpetas ("Factor N. ..." y "N. ...")
pdf = "OneDrive_1_9-23-2026"
salida = "salida"
# Datos que no salen de las presentaciones (marcos, correspondencias, indicadores, cursos, brechas)
semillas = "datos/semillas"
# Planes de Aprendizaje Digital (PAD) de cada CADI, en PDF (con subcarpetas)
pads = "PADs"
# Anexos del documento maestro RRC 2025. Los documentos maestros se declaran en datos/semillas/documentos.csv
anexos = "ANEXOS"
# Proyecto Jardín Vivo RA (modelos 3D de plantas y fotografías 360): Modelos/, AR_models/, Imagenes360/
recursos_ra = "F:/ProyectoPlantasRA"

# Carpeta con pdftotext y pdfinfo, solo si no están en el PATH.
# También se puede indicar con la variable de entorno INDICE_POPPLER.
# poppler = "C:/Users/usuario/AppData/Local/Programs/poppler/poppler-26.09.0/Library/bin"
